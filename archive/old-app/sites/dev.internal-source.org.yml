# 星陨阁-dev 预设配置
# 用户只需填写下方 [必填] 凭据即可使用

name: "星陨阁-dev"
base_url: "https://dev.internal-source.org"
type: classic                     # NexusPHP 传统表单 takeupload.php

# 公告 URL 模板
announce: "https://dev.internal-source.org/announce.php?passkey={passkey}"

# 分类映射
categories:
  电影: 401
  电视剧: 402
  综艺: 403
  纪录片: 404
  动漫: 405
  MV: 406
  体育: 407
  音频: 408
  其他: 409
  短剧: 410

# 标签映射 (源站标签名 → 目标站标签 ID)
# 注意: takeupload.php 标签用 tags[4][] checkbox，value 必须是数字 ID
tags:
  官方: { skip: true, reason: "不是自家站点不算官方" }
  国语: 5
  中字: 6
  去头尾广告纯净版: 25
  HDR: 7
  完结: 11
  分集: 10
  首发: 2
  禁转: 1
  DIY: 4
  特效: 18
  特效字幕: 9
  杜比视界: 8
  粤语: 12
  英字: 15
  美剧: 13
  韩剧: 14
  应求: 16
  大包: 17
  高码率: 27
  高帧率: 26
  原生: 24
  补帧: 20
  超分: 19
  零魔: 22
  驻站: 23

# 维度 taxonomy ID (zone 4，动漫用)
dimensions:
  medium:
    Blu-ray: 1
    "UHD Blu-ray": 2
    Remux: 3
    WEB-DL: 4
    HDTV: 5
    DVD: 6
    Encode: 7
    CD: 8
    Track: 9
    Other: 10
  codec:
    "H.264/AVC": 1
    "H.265/HEVC": 2
    VC-1: 3
    MPEG-2: 4
    AV1: 5
    Other: 6
  audiocodec:
    FLAC: 1
    MP3: 2
    WAV: 3
    M4A: 4
    DTS: 5
    "DTS-HD MA": 6
    "DTS:X": 7
    TrueHD: 8
    LPCM: 9
    "DD/AC3": 10
    "DDP/E-AC3": 11
    "TrueHD Atmos": 12
    APE: 13
    AAC: 14
    ALAC: 15
    Other: 16
    OPUS: 17
    AV3V: 18
  standard:
    "480p/480i": 1
    "720p/720i": 2
    "1080p/1080i": 3
    "4K/2160p/2160i": 4
    "8K/4320p/4320i": 5
    Other: 6
  team:
    HDS: 1
    CHD: 2
    MySiLU: 3
    WiKi: 4
    Other: 5
    rain: 6
    rainweb: 7
    StarfallWeb: 8
    AGSVWEB: 9
    Starfall: 10
    NatureWeb: 11
    "Pure@StarfallWeb": 12

# 团队别名 (源站出现的变体 → 目标站标准名)
team_aliases:
  "Pure@StarfallWeb": "Pure@StarfallWeb"
  StarfallWeb: StarfallWeb

# 表单 zone ID
zone: 4

# [必填] 用户凭据 (环境变量注入)
credentials:
  - name: cookie
    env: AUTOSEED_DEV_COOKIE
    label: "登录 Cookie"
    required: true
  - name: passkey
    env: AUTOSEED_DEV_PASSKEY
    label: "Tracker Passkey"
    required: true
