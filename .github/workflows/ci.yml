name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    name: Backend (Go test + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx vue-tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image (build/push/scan)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # tag 推送（GHCR）；PR 只构建不推送
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (dev)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/autoseedrelay:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/autoseedrelay:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/autoseedrelay:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build only (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/autoseedrelay:pr-${{ github.event.pull_request.number }}

      # 镜像漏洞扫描（TODO: 稳定后 pin 到具体 SHA）
      - name: Trivy scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/autoseedrelay:dev
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
